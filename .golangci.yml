version: "2"
linters:
  default: standard
  enable:
    - revive
    # A verifier is what a gateway trusts; it gets the security and
    # correctness linters, not just the standard set.
    - gosec
    - errorlint
    - nilerr
    - copyloopvar
    - makezero
    # Complexity ceilings. A function over them is one a reviewer cannot
    # hold in their head, and in a verifier that is where a wrong verdict
    # hides. maintidx folds Halstead volume, cyclomatic complexity and
    # length into one maintainability index.
    #
    # gocyclo, gocognit and funlen are configured below but not enabled
    # here: scripts/complexity.sh (make complexity) runs them against the
    # committed baseline of functions already over the portfolio ceilings,
    # which may only shrink. Enabling them here would fail on that backlog,
    # and silencing it would take a suppression per function.
    - nestif
    - maintidx
  settings:
    gocyclo:
      min-complexity: 10
    gocognit:
      min-complexity: 15
    nestif:
      min-complexity: 5
    funlen:
      lines: 60
      statements: 50
    maintidx:
      under: 20
    revive:
      rules:
        - name: exported
          arguments: ["checkPrivateReceivers", "disableStutteringCheck"]
    gosec:
      excludes:
        # G104 duplicates errcheck, which is already in the standard set.
        - G104
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, revive, gosec]
      # A table-driven test is long by design; the ceilings are for code
      # that runs.
      - path: _test\.go
        linters: [gocyclo, gocognit, nestif, funlen, maintidx]
formatters:
  enable:
    - gofmt
