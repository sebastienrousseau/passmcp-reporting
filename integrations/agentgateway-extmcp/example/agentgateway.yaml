#
# agentgateway local configuration with two MCP backends gated by the
# passmcp attestation processor. Target names here ("github", "everything")
# are what the gateway sends in McpRequest.service_names, so they must
# match the keys of config.json's "targets".
#
# The processor runs on the same host, so it may serve without TLS on
# loopback; anywhere else it needs a key pair (see the README's TLS
# section, and backendTLS below):
#
#   agentgateway-extmcp -config example/config.json -listen 127.0.0.1:4400 -plaintext
#   agentgateway -f example/agentgateway.yaml

# yaml-language-server: $schema=https://agentgateway.dev/schema/config
mcp:
  port: 3000
  # mcpGuardrails belongs here or on a route. agentgateway rejects it under
  # an individual mcp.targets[] entry ("unknown field `mcpGuardrails`"):
  # MCP policies apply to the whole target set. The processor tells targets
  # apart through McpRequest.service_names, so per-target gating needs no
  # per-target placement.
  policies:
    cors:
      allowOrigins: ["*"]
      allowHeaders: [mcp-protocol-version, content-type, mcp-session-id]
    mcpGuardrails:
      processors:
        - kind: remote
          host: 127.0.0.1:4400
          # For a processor started with -tls-cert and -tls-key, connect
          # over TLS; root is the CA the processor's certificate chains
          # to, and hostname the name to verify when host is not on it.
          # policies:
          #   backendTLS:
          #     root: /etc/agentgateway/extmcp-ca.pem
          #     hostname: extmcp.internal
          # A processor that is down or answers badly denies the call.
          # failOpen would let unattested backends through while the
          # processor restarts, which defeats the point of gating.
          failureMode: failClosed
          # Gate the methods that reach one backend. tools/list is left
          # out on purpose: one listing spans every target, so gating it
          # would hide the attested backends' tools behind a single
          # unattested one. Calls to an unattested backend are still
          # denied. The processor answers Pass for anything else it is
          # asked, but not asking is cheaper.
          methods:
            tools/call: request
            resources/read: request
            prompts/get: request
  targets:
    - name: github
      mcp:
        host: https://api.githubcopilot.com/mcp/
    - name: everything
      stdio:
        cmd: npx
        args: ["@modelcontextprotocol/server-everything"]
