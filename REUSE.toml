# SPDX-FileCopyrightText: 2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>
# SPDX-License-Identifier: Apache-2.0
#
# Machine-readable licensing, per the REUSE specification. Every source file
# carries an SPDX header and scripts/spdx_sweep.go fails the build when one
# does not; this file covers what a header cannot.

version = 1
SPDX-PackageName = "passmcp-reporting"
SPDX-PackageSupplier = "Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/sebastienrousseau/passmcp-reporting"

# The published schemas. Generated by scripts/specgen from the attestation,
# a2a and graph types; JSON has no comment syntax, so the copyright and
# the licence are recorded here and in each file's $comment.
[[annotations]]
path = ["spec/attestation/*.json", "spec/graph/*.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

# The test fixture: a statement this package writes and accepts, kept
# current by a test.
[[annotations]]
path = ["**/testdata/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

# Go module metadata and repository configuration whose formats take no
# comments.
[[annotations]]
path = ["go.mod", "go.sum", ".gitignore", ".github/CODEOWNERS", ".devcontainer/devcontainer.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

# The agentgateway integration's module metadata and its example
# configuration: formats that take no comments.
[[annotations]]
path = ["integrations/*/go.mod", "integrations/*/go.sum", "integrations/*/example/*.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

# The README demo, rendered by `make demo` from .github/demo.tape; a GIF has
# nowhere to carry a header.
[[annotations]]
path = [".github/demo.gif"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

# Generated by pip-compile, which rewrites the whole file: the manual's
# hash-locked build requirements, kept identical to passmcp's lock.
[[annotations]]
path = ["docs/requirements.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"
