name: Feature request
description: Something a statement should carry, a check the verifier should make, or something the processor should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        A change to what `Validate` accepts is a change every gateway on
        either side of it sees. It needs a tracking issue open for at
        least a week before it lands (CONTRIBUTING.md), and this issue
        can be that tracking issue.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to decide, display or verify from a statement that the format or the verifier makes hard or impossible? Describe the situation, not the feature.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like to change
      description: For a format change, the field and what it would mean; say whether a statement valid today would be refused afterwards, or the reverse.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
      description: The extra parsing, the second tool, the manual step. This is often the most useful part.
