name: Bug report
description: A statement Validate judged wrongly, a schema that disagrees with the types, or the agentgateway processor misbehaving
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security issue — a statement that validates although
        it was tampered with, a credential in a processor denial — **stop**
        and report it privately through
        [GitHub's private vulnerability reporting](https://github.com/sebastienrousseau/passmcp-reporting/security/advisories/new)
        instead. See [SECURITY.md](https://github.com/sebastienrousseau/passmcp-reporting/blob/main/SECURITY.md).

        A question about a verdict itself (why passmcp judged a server
        the way it did) belongs in [passmcp's issues](https://github.com/sebastienrousseau/passmcp/issues):
        this repository only reads what passmcp wrote.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - attestation (the MCP evaluation verifier)
        - a2a (the A2A evaluation verifier)
        - graph (the security graph model and store)
        - spec (the published JSON Schemas)
        - agentgateway-extmcp (the processor)
        - scripts, CI or documentation
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did Validate, Parse or the processor return? Paste the error or the log line, not a summary of it.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      description: If a statement was accepted or refused wrongly, say which rule it breaks or satisfies and how you know.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The statement (redact the endpoint if you must), and the code or command that reads it. For the processor, its configuration and flags, with any URL you cannot share redacted.
      render: shell
      placeholder: go run ./examples/verify statement.json
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versions
      description: This module's version (or the processor's tag), and the passmcp version that wrote the statement.
      placeholder: satellion.com/passmcp-reporting v0.0.4, passmcp 0.0.4
    validations:
      required: true
