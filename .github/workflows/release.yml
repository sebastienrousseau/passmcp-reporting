# A release of a Go module is a signed tag; the module proxy serves it. A
# release here is two tags, vX.Y.Z for the root module and
# integrations/agentgateway-extmcp/vX.Y.Z for the processor, and each gets
# its release page in the family's layout (scripts/release-pages.sh): the
# hand-written highlights from docs/releases/, GitHub's generated
# "What's Changed", the checksums section, which names the processor
# image's digest because neither release attaches files, and the
# full-changelog link. The processor's page is titled after it and never
# marked latest.
name: Release

on:
  push:
    tags: ["v*", "integrations/agentgateway-extmcp/v*"]
  # Dry-run mode: verifies the versions and prints both pages for the
  # newest CHANGELOG release, then stops short of publishing anything.
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Verify the release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag, the changelog and the README agree
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ]; then
            tag="v$(grep -Eo '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | head -1 | tr -d '#[] ')"
          fi
          scripts/verify-release-versions.sh "${tag}"

  # The agentgateway processor as a multi-arch image, pushed under the
  # release's version and given SLSA build provenance on its digest. The image is built from
  # the processor's directory alone, as `go install` sees the module; the
  # Dockerfile pins both base images by digest.
  image:
    name: Publish the processor image
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/sebastienrousseau/passmcp-agentgateway-extmcp
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "${IMAGE}:${TAG#v}" \
            --label "org.opencontainers.image.version=${TAG#v}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --metadata-file "${RUNNER_TEMP}/metadata.json" \
            --push \
            integrations/agentgateway-extmcp
          digest=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "${RUNNER_TEMP}/metadata.json")
          [[ "${digest}" == sha256:* ]] || { echo "::error::no image digest in the build metadata"; exit 1; }
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "${IMAGE}:${TAG#v} is ${digest}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # The pages come last, because the checksums section names the digest
  # the registry serves for the image. The root tag's run publishes the
  # root page, and the processor's page too when its tag is already
  # pushed; the processor tag's run publishes the processor's page, and
  # fails, to be re-run, if the image is not published yet. A dry run
  # prints both. Each published page is read back before the step passes.
  pages:
    name: Publish the release pages
    needs: [release, image]
    if: ${{ !cancelled() && needs.release.result != 'failure' && needs.image.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Compose and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          nested=integrations/agentgateway-extmcp
          publish=(--publish)
          case "${GITHUB_REF}" in
            "refs/tags/${nested}/v"*)
              scripts/release-pages.sh --publish processor "${GITHUB_REF_NAME##*/v}"
              exit 0 ;;
            refs/tags/v*) ver="${GITHUB_REF_NAME#v}" ;;
            *)
              ver=$(grep -Eo '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | head -1 | tr -d '#[] ')
              publish=() ;;
          esac
          scripts/release-pages.sh "${publish[@]}" root "${ver}"
          if [ "${#publish[@]}" -eq 0 ] || git rev-parse -q --verify "refs/tags/${nested}/v${ver}" >/dev/null; then
            scripts/release-pages.sh "${publish[@]}" processor "${ver}"
          else
            echo "${nested}/v${ver} is not pushed yet; its own run publishes its page"
          fi
