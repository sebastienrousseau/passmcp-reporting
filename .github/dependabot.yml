version: 2
updates:
  # There are no module dependencies to bump; this keeps the toolchain
  # directive current and would catch one being added.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
  # The agentgateway processor is its own module, with the dependencies
  # the root does without (gRPC, protobuf), and is released as an image
  # whose two base images are pinned by digest. Neither is under "/".
  - package-ecosystem: "gomod"
    directory: "/integrations/agentgateway-extmcp"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "docker"
    directory: "/integrations/agentgateway-extmcp"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"
